root_dir: "~/data"

# Data dirs
data_dirs:
  train:
    - path: "/COCO2017_Ultra/train"

  validation:
   - path: "/COCO2017_Ultra/val"
  # test:

# YOLO11 Config
model:
  variant: "yolo_v11_n"       # Nano ver - 18k - batch 64 ok
  # variant: "yolo_v11_m"     # Medium ver
  # variant: "yolo_v11_x"     # Xtra Large ver
  nc: 80                      # Number of Class - Text detect task.
  class_names:                      # COCO17 Class names - mapping from 0-79
    0: person
    1: bicycle
    2: car
    3: motorcycle
    4: airplane
    5: bus
    6: train
    7: truck
    8: boat
